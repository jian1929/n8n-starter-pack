name: validate-workflows
on: [push, pull_request]
jobs:
  json-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate template JSON files
        run: |
          for f in workflows/*.json; do
            node -e "const w=require('./'+process.argv[1]); if(!Array.isArray(w.nodes)||typeof w.connections!=='object'){throw new Error('invalid workflow: '+process.argv[1]);} console.log('OK', w.nodes.length, 'nodes -', process.argv[1]);" "$f"
          done